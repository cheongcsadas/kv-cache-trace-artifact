[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvtrail-artifact"
version = "0.7.0"
description = "Reproducible KV management observation and privacy evaluation"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["attacks*", "defenses*", "experiments*", "evaluation*", "datasets*", "backends*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"experiments.acquisition" = ["*.cu"]
"experiments.*" = ["*.yaml", "*.md"]
"backends.*" = ["*.txt", "*.md"]
