schema_version: 1
method: rule_derived_single_label
description: Source-text semantic targets with exactly 3 intent, 60 sensitive-attribute and 60 single-keyword classes
  per domain. Attribute labels describe the health, financial, contractual or computational property exposed by
  a grounded keyword. Aliases and original character spans provide auditable evidence. The declared vocabulary is
  fixed; observed corpus coverage is validated separately before training.
domains:
  medical:
    intent:
    - label: condition_information
      description: Ask about a condition, its causes, manifestations or diagnosis.
      priority: 10
      aliases:
      - what is
      - what are
      - causes
      - cause
      - symptoms
      - symptom
      - diagnosis
      - diagnose
      - diagnosed
      - screening
      - signs
      - affected
      - common
    - label: treatment_prevention
      description: Ask about treatment, prevention or ongoing condition management.
      priority: 30
      aliases:
      - treatment
      - treatments
      - treated
      - treat
      - prevention
      - prevent
      - prevented
      - management
      - manage
      - managing
      - cure
      - cured
      - therapy
      - therapies
    - label: prognosis_inheritance
